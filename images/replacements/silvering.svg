<title id="title">Silvering a surface</title><desc id="desc">A glass flask with a silver coating accompanies the balanced ionic equation RCHO + 2 Ag+ + 3 OH− → RCOO− + 2 Ag + 2 H2O.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2868a6"/></marker></defs>
