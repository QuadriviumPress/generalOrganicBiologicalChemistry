<text x="45" y="56" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="start" font-weight="bold">Silvering a surface</text>
<path d="M455 150 V215 L405 340 Q395 365 425 365 H545 Q575 365 565 340 L515 215 V150 Z" fill="#f3f8fb" stroke="#193348" stroke-width="3"/>
<path d="M463 170 V217 L417 340 Q412 353 430 353 H540 Q555 353 553 340 L507 217 V170" fill="none" stroke="#adbcc6" stroke-width="13"/>
<text x="730" y="300" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Deposited silver</text>
