<text x="500" y="475" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#193348" text-anchor="middle" font-weight="normal">RCHO + 2 Ag⁺ + 3 OH⁻ → RCOO⁻ + 2 Ag + 2 H₂O</text>
<text x="500" y="535" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Aldehyde oxidized; silver(I) reduced</text>
<text x="45" y="596" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#506578" text-anchor="start" font-weight="normal">QuadriviumPress · Original educational schematic · Not to scale</text>
