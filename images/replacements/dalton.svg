<text x="500" y="170" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#193348" text-anchor="middle" font-weight="bold">John Dalton · circa 1803</text>
<circle cx="250" cy="310" r="35" fill="#177c73" stroke="#193348" stroke-width="2"/>
<circle cx="500" cy="310" r="35" fill="#177c73" stroke="#193348" stroke-width="2"/>
