<text x="500" y="140" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193348" text-anchor="middle" font-weight="normal">Blood: cells retained; small waste solutes can cross</text>
<text x="500" y="525" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193348" text-anchor="middle" font-weight="normal">Dialysate: lower concentration of waste solutes</text>
<text x="500" y="570" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#193348" text-anchor="middle" font-weight="normal">Membrane separates the two flowing fluids</text>
