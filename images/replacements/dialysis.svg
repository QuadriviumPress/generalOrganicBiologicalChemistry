<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Hemodialysis</title><desc id="desc">Blood and dialysate flow along opposite sides of a semipermeable membrane. Small waste solutes cross the membrane while blood cells remain on the blood side.</desc>
