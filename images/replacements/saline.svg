<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Mass per volume percent</title><desc id="desc">A balance holding 0.9 g NaCl is connected by an arrow to a 100 mL solution in a volumetric vessel; the final volume, rather than the added water volume, is specified.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2868a6"/></marker></defs>
<rect width="1000" height="100%" fill="#fff"/>
<path d="M40 88 H960" stroke="#177c73" stroke-width="4"/>
<text x="45" y="56" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="start" font-weight="bold">Mass per volume percent</text>
<rect x="85" y="300" width="270" height="100" rx="10" fill="#e5edf3" stroke="#193348" stroke-width="3"/>
<rect x="130" y="260" width="180" height="30" rx="10" fill="#ccd7df" stroke="#193348" stroke-width="3"/>
<text x="220" y="365" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#193348" text-anchor="middle" font-weight="normal">0.9 g NaCl</text>
<line x1="400" y1="330" x2="555" y2="330" stroke="#2868a6" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M695 160 v65 l-50 125 q-10 25 20 25 h120 q30 0 20-25 l-50-125 v-65 Z" fill="#f5fafc" stroke="#193348" stroke-width="3"/>
<path d="M675 285 l-20 55 q-8 20 15 20 h110 q23 0 15-20 l-20-55 Z" fill="#a2cfe9" stroke="#a2cfe9" stroke-width="3"/>
<path d="M695 228 L645 350 Q635 375 665 375 H785 Q815 375 805 350 L755 228 Z" fill="#a2cfe9" stroke="#a2cfe9" stroke-width="3"/>
<line x1="690" y1="228" x2="760" y2="228" stroke="#bb4354" stroke-width="3"/>
<text x="725" y="470" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#193348" text-anchor="middle" font-weight="normal">100 mL final solution</text>
<text x="500" y="550" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#193348" text-anchor="middle" font-weight="normal">0.9 g / 100 mL = 0.9% (m/v)</text>
<text x="45" y="596" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#506578" text-anchor="start" font-weight="normal">QuadriviumPress · Original educational schematic · Not to scale</text>
</svg>
