<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Oil and water</title><desc id="desc">A transparent vessel contains a yellow oil layer above a red water layer, with each layer labeled.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2868a6"/></marker></defs>
<rect width="1000" height="100%" fill="#fff"/>
<path d="M40 88 H960" stroke="#177c73" stroke-width="4"/>
<text x="45" y="56" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="start" font-weight="bold">Oil and water</text>
<path d="M260 160 V490 H590 V160" fill="#fff" stroke="#193348" stroke-width="3"/>
<rect x="270" y="220" width="310" height="100" rx="0" fill="#efd66d" stroke="#efd66d" stroke-width="3"/>
<rect x="270" y="320" width="310" height="160" rx="0" fill="#e69ba3" stroke="#e69ba3" stroke-width="3"/>
<text x="770" y="280" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#193348" text-anchor="middle" font-weight="normal">Oil — upper layer</text>
<line x1="580" y1="275" x2="620" y2="275" stroke="#193348" stroke-width="3"/>
<text x="770" y="400" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#193348" text-anchor="middle" font-weight="normal">Water — lower layer</text>
<line x1="580" y1="395" x2="620" y2="395" stroke="#193348" stroke-width="3"/>
<text x="500" y="550" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Two liquid phases; the liquids are not miscible.</text>
<text x="45" y="596" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#506578" text-anchor="start" font-weight="normal">QuadriviumPress · Original educational schematic · Not to scale</text>
</svg>
