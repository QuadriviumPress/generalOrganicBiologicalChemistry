<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Positron emission tomography</title><desc id="desc">A detector ring around a patient records two opposing 511 keV photons from a positron–electron annihilation event. The drawing is schematic and not to scale.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2868a6"/></marker></defs>
<rect width="1000" height="100%" fill="#fff"/>
<path d="M40 88 H960" stroke="#177c73" stroke-width="4"/>
<text x="45" y="56" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="start" font-weight="bold">Positron emission tomography</text>
<ellipse cx="500" cy="330" rx="180" ry="195" fill="#f3f6f8" stroke="#193348" stroke-width="18"/>
<rect x="440" y="270" width="120" height="170" rx="50" fill="#d9e7ed" stroke="#193348" stroke-width="3"/>
<circle cx="500" cy="230" r="28" fill="#d9e7ed" stroke="#193348" stroke-width="2"/>
<circle cx="500" cy="330" r="9" fill="#bb4354" stroke="#193348" stroke-width="2"/>
<line x1="490" y1="330" x2="300" y2="330" stroke="#2868a6" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="510" y1="330" x2="700" y2="330" stroke="#2868a6" stroke-width="4" marker-end="url(#arrow)"/>
<text x="200" y="285" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193348" text-anchor="middle" font-weight="normal">511 keV γ</text>
<text x="800" y="285" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193348" text-anchor="middle" font-weight="normal">511 keV γ</text>
<text x="500" y="125" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#193348" text-anchor="middle" font-weight="normal">Detector ring</text>
<text x="500" y="560" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Coincident photons locate an annihilation line.</text>
<text x="45" y="596" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#506578" text-anchor="start" font-weight="normal">QuadriviumPress · Original educational schematic · Not to scale</text>
</svg>
