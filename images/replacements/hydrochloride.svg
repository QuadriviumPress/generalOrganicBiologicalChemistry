<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">A medicine as a hydrochloride salt</title><desc id="desc">RNH2 + HCl → RNH3+ + Cl−, with the amine, acid, and ammonium salt labeled.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2868a6"/></marker></defs>
<rect width="1000" height="100%" fill="#fff"/>
<path d="M40 88 H960" stroke="#177c73" stroke-width="4"/>
<text x="45" y="56" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="start" font-weight="bold">A medicine as a hydrochloride salt</text>
<rect x="65.0" y="220" width="180" height="160" rx="10" fill="#eff7f5" stroke="#193348" stroke-width="3"/>
<text x="155" y="310" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#193348" text-anchor="middle" font-weight="normal">RNH₂</text>
<text x="155" y="435" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Amine base</text>
<rect x="325.0" y="220" width="160" height="160" rx="10" fill="#eff7f5" stroke="#193348" stroke-width="3"/>
<text x="405" y="310" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#193348" text-anchor="middle" font-weight="normal">HCl</text>
<text x="405" y="435" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Acid</text>
<rect x="620.0" y="220" width="300" height="160" rx="10" fill="#eff7f5" stroke="#193348" stroke-width="3"/>
<text x="770" y="310" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#193348" text-anchor="middle" font-weight="normal">RNH₃⁺ Cl⁻</text>
<text x="770" y="435" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">Hydrochloride salt</text>
<text x="280" y="315" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193348" text-anchor="middle" font-weight="normal">+</text>
<line x1="545" y1="300" x2="625" y2="300" stroke="#2868a6" stroke-width="4" marker-end="url(#arrow)"/>
<text x="500" y="525" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#193348" text-anchor="middle" font-weight="normal">The amine accepts a proton from hydrochloric acid.</text>
<text x="45" y="596" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#506578" text-anchor="start" font-weight="normal">QuadriviumPress · Original educational schematic · Not to scale</text>
</svg>
